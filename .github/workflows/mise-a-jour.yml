name: Mise à jour des feux

# Deux passages par jour : les satellites VIIRS survolent la France plusieurs fois
# quotidiennement, et une image Sentinel-2 publiée le matin doit être exploitée le jour
# même. Déclenchement manuel possible depuis l'onglet Actions.
on:
  schedule:
    - cron: "15 6 * * *"
    - cron: "15 16 * * *"
  workflow_dispatch:
    inputs:
      jours:
        description: "Fenêtre FIRMS en jours"
        default: "4"
      min_points:
        description: "Points chauds minimum par foyer"
        default: "5"

concurrency:
  group: mise-a-jour
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  detecter:
    runs-on: ubuntu-latest
    # La détection lit des images satellite à distance ; un foyer lent ne doit pas
    # bloquer la journée entière.
    timeout-minutes: 90
    # Un `if:` d'étape ne sait pas lire le contexte `secrets` ; il lit `env`. Ce report
    # est ce qui permet à l'étape Cloudflare de s'ignorer tant que le jeton n'existe pas.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Installer les dépendances
        run: uv sync --frozen

      - name: Points chauds VIIRS
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: |
          test -n "$FIRMS_MAP_KEY" || { echo "::error::secret FIRMS_MAP_KEY absent"; exit 1; }
          PYTHONPATH=scripts uv run python scripts/firms.py \
            --jours "${{ github.event.inputs.jours || '4' }}"

      - name: Détection des périmètres
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          AWS_NO_SIGN_REQUEST: "YES"
        run: |
          PYTHONPATH=scripts uv run python -u scripts/detecter.py \
            --foyers data/work/foyers.geojson \
            --min-points "${{ github.event.inputs.min_points || '5' }}" \
            --max-foyers 150

      - name: Construire le site
        run: PYTHONPATH=scripts uv run python scripts/site.py

      - name: Audit avant publication
        run: PYTHONPATH=scripts uv run python scripts/verifier_publication.py

      # Le site et son historique sont versionnés : c'est ce qui permet de dire
      # « nouveau » ou « agrandi » d'une exécution à l'autre, et de garder une trace
      # publique de ce qui a été affiché et quand.
      - name: Enregistrer les données publiées
        run: |
          git config user.name "brulis-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # data/feux/ est l'archive des périmètres : sans elle, chaque exécution
          # repart de zéro et les feux mesurés disparaissent au passage suivant.
          git add site/ data/feux/
          if git diff --cached --quiet; then
            echo "aucun changement"
          else
            git commit -m "Mise à jour automatique des feux ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi

      # Cloudflare Pages est la cible visée : c'est le seul des deux hébergeurs qui lit
      # `site/_headers`, donc le seul où la CSP du site s'applique réellement. GitHub
      # Pages sert les mêmes fichiers en ignorant ce fichier en silence.
      #
      # L'étape s'efface tant que le secret est absent, pour que la mise en ligne ne
      # dépende pas de l'ordre dans lequel les jetons sont créés. Une fois un
      # déploiement Cloudflare vert, la publication GitHub Pages ci-dessous n'a plus de
      # raison d'être et peut partir.
      - name: Publier sur Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=brulis

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publier:
    needs: detecter
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
